[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watchagent"
version = "0.1.0"
description = "WatchAgent — a FastAPI weather-monitoring service."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "httpx>=0.28,<0.29",
]

# Storage uses the standard-library sqlite3 module, so no DB driver dependency.
# httpx is a runtime dependency (used by the poller) and also satisfies
# FastAPI's TestClient, which is exercised by the test suite.
[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
